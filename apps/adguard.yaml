apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adguard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/DanielCraciunGitHub/homelab.git'
    targetRevision: HEAD
    path: apps/adguard
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dns-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
