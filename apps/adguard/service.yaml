apiVersion: v1
kind: Service
metadata:
  name: adguard-dns
  namespace: dns-system
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.1.201
spec:
  type: LoadBalancer
  ports:
    - port: 53
      targetPort: 53
      protocol: UDP
      name: dns-udp
    - port: 80
      targetPort: 80
      name: web-http
    - port: 3000
      targetPort: 3000
      name: setup-http
  selector:
    app: adguard
