apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/DanielCraciunGitHub/homelab.git'
    targetRevision: HEAD
    path: apps/jellyfin
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: jellyfin
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
