apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  sources:
    # Source 1: upstream Helm chart
    - repoURL: 'https://grafana.github.io/helm-charts'
      chart: loki-stack
      targetRevision: "2.10.2"
      helm:
        valueFiles:
          - $values/apps/loki/values.yaml
    # Source 2: our Git repo, referenced as $values
    - repoURL: 'https://github.com/DanielCraciunGitHub/homelab.git'
      targetRevision: HEAD
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
