## kube-prometheus-stack values
## Chart version: 88.3.0

# ──────────────────────────────────────────────
# Grafana
# ──────────────────────────────────────────────
grafana:
  adminPassword: "cocomimi"   # change if desired

  service:
    type: LoadBalancer
    loadBalancerIP: 192.168.1.205

  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: traefik
    hosts:
      - grafana.home
    paths:
      - /

  persistence:
    enabled: true
    storageClassName: local-path
    size: 512Mi

  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki:3100
      access: proxy

  dashboards:
    default:
      # Node Exporter Full — CPU, memory, disk, network per node
      node-exporter-full:
        gnetId: 1860
        revision: 37
        datasource: Prometheus
      # Kubernetes cluster overview — pod/node health at a glance
      kubernetes-cluster:
        gnetId: 7249
        revision: 1
        datasource: Prometheus
      # Kubernetes workloads — per-namespace CPU/memory breakdown
      kubernetes-workloads:
        gnetId: 15757
        revision: 37
        datasource: Prometheus
      # Loki log explorer — search and tail logs from Grafana
      loki-logs:
        gnetId: 13639
        revision: 2
        datasource: Loki
      # ArgoCD — app sync status, health, and repo activity
      argocd:
        gnetId: 14584
        revision: 1
        datasource: Prometheus
      # Traefik — request rates, latencies, error rates
      traefik:
        gnetId: 17346
        revision: 9
        datasource: Prometheus

# ──────────────────────────────────────────────
# Prometheus
# ──────────────────────────────────────────────
prometheus:
  service:
    type: LoadBalancer
    loadBalancerIP: 192.168.1.206

  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: traefik
    hosts:
      - prometheus.home
    paths:
      - /

  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 4Gi
    retention: 15d

# ──────────────────────────────────────────────
# Alertmanager
# ──────────────────────────────────────────────
alertmanager:
  enabled: true

  service:
    type: ClusterIP   # internal only for now

  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

# ──────────────────────────────────────────────
# Node exporter + kube-state-metrics (defaults fine)
# ──────────────────────────────────────────────
nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
