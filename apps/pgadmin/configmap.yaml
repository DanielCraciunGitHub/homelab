apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-config
  namespace: cnpg-system
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "postgres-cluster",
          "Group": "Servers",
          "Host": "postgres-cluster-rw",
          "Port": 5432,
          "MaintenanceDB": "app",
          "Username": "app",
          "SSLMode": "prefer",
          "PassFile": "/pgadmin4/pgpass"
        }
      }
    }
