apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: cnpg-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      securityContext:
        fsGroup: 5050
      initContainers:
        - name: pgpass-fix
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cp /secret/pgpass /pgpass-fixed/pgpass
              chmod 0600 /pgpass-fixed/pgpass
              chown 5050 /pgpass-fixed/pgpass
          volumeMounts:
            - name: pgadmin-pgpass-secret
              mountPath: /secret
              readOnly: true
            - name: pgadmin-pgpass
              mountPath: /pgpass-fixed
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:9
          ports:
            - containerPort: 80
              name: http
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: admin@pgadmin.home
            - name: PGADMIN_DEFAULT_PASSWORD
              value: admin
            - name: PGADMIN_CONFIG_SERVER_MODE
              value: "False"
            - name: PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED
              value: "False"
          volumeMounts:
            - name: pgadmin-data
              mountPath: /var/lib/pgadmin
            - name: pgadmin-servers
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
              readOnly: true
            - name: pgadmin-pgpass
              mountPath: /pgadmin4/pgpass
              subPath: pgpass
              readOnly: true
      volumes:
        - name: pgadmin-data
          persistentVolumeClaim:
            claimName: pgadmin-pvc
        - name: pgadmin-servers
          configMap:
            name: pgadmin-config
        - name: pgadmin-pgpass-secret
          secret:
            secretName: postgres-cluster-app
            items:
              - key: pgpass
                path: pgpass
        - name: pgadmin-pgpass
          emptyDir: {}
