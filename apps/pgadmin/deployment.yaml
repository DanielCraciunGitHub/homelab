---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgadmin-pvc
  namespace: cnpg-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 512Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-config
  namespace: cnpg-system
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "postgres-cluster",
          "Group": "Servers",
          "Host": "postgres-cluster",
          "Port": 5432,
          "MaintenanceDB": "app",
          "Username": "postgres",
          "SSLMode": "prefer",
          "PassFile": "/pgadmin4/pgpass"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: cnpg-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      securityContext:
        fsGroup: 5050
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:9
          ports:
            - containerPort: 80
              name: http
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              value: admin@pgadmin.home
            - name: PGADMIN_DEFAULT_PASSWORD
              value: admin
            - name: PGADMIN_CONFIG_SERVER_MODE
              value: "False"
            - name: PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED
              value: "False"
          volumeMounts:
            - name: pgadmin-data
              mountPath: /var/lib/pgadmin
            - name: pgadmin-servers
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
              readOnly: true
            - name: pgadmin-pgpass
              mountPath: /pgadmin4/pgpass
              subPath: pgpass
              readOnly: true
      volumes:
        - name: pgadmin-data
          persistentVolumeClaim:
            claimName: pgadmin-pvc
        - name: pgadmin-servers
          configMap:
            name: pgadmin-config
        - name: pgadmin-pgpass
          secret:
            secretName: postgres-cluster-superuser
            items:
              - key: pgpass
                path: pgpass
            defaultMode: 0600
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: cnpg-system
spec:
  selector:
    app: pgadmin
  ports:
    - port: 80
      targetPort: 80
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgadmin-ingress
  namespace: cnpg-system
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: pgadmin.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pgadmin
                port:
                  name: http
