apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  url: https://argocd.dc.home
  oidc.config: |
    name: Authentik
    issuer: https://authentik.dc.home/application/o/argocd/
    clientID: R4fkHEIwJIUDUIQN2Fe7EMnWJI3o12QMMKswbjg1
    clientSecret: $oidc.authentik.clientSecret
    requestedScopes: ["openid", "profile", "email", "groups"]