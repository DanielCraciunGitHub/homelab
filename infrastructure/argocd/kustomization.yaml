apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.1/manifests/install.yaml
  - namespace.yaml
  - argocd-ingress.yaml
  - argocd-oidc-sealed-secret.yaml
  - argocd-servicemonitors.yaml
  - argocd-server-metrics-servicemonitor.yaml
  - argocd-repo-server-servicemonitor.yaml
  - argocd-notifications-servicemonitor.yaml

patches:
  - path: argocd-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-cm
  - path: argocd-rbac-cm.yaml
    target:
      kind: ConfigMap
      name: argocd-rbac-cm