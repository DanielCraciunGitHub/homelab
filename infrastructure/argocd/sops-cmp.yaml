apiVersion: v1
kind: ConfigMap
metadata:
  name: cmp-sops
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: sops
    spec:
      version: v1.0

    discover:
      find:
        command:
          - sh
          - -c
          - |
            find . -maxdepth 1 -name '*.sops.yaml' -print -quit | grep -q .

    generate:
      command:
        - sh
        - -c
        - |
          set -e

          find . -maxdepth 1 -name '*.sops.yaml' -exec sops -d -i {} \;

          kustomize build .