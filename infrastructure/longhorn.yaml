apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd

spec:
  project: default

  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: engines.longhorn.io
      jsonPointers:
        - /spec/preserveUnknownFields

  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.8.2
      helm:
        values: |
          persistence:
            defaultClass: true
            defaultClassReplicaCount: 1

          preUpgradeChecker:
            jobEnabled: false

    - repoURL: https://github.com/DanielCraciunGitHub/homelab.git
      targetRevision: HEAD
      path: infrastructure/longhorn

  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true