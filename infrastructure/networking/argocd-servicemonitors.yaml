# ServiceMonitors for ArgoCD — allows kube-prometheus-stack to scrape all ArgoCD metrics endpoints
# The `release: monitoring` label is required for the Prometheus Operator to discover these

# Application Controller — app sync status, health, resource usage
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-metrics
  namespace: argocd
  labels:
    release: monitoring
spec:
  endpoints:
    - port: metrics
      interval: 30s
  namespaceSelector:
    matchNames:
      - argocd
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-metrics
---
# ArgoCD Server — API server request rates, gRPC stats
