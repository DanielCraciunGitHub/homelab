apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  namespace: wireguard-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wireguard
  template:
    metadata:
      labels:
        app: wireguard
    spec:
      containers:
        - name: wireguard
          image: linuxserver/wireguard:1.0.20260223
          ports:
            - containerPort: 51820
              protocol: UDP
              name: wireguard-udp
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/London"
            - name: SERVERURL
              value: "dcraciun.tplinkdns.com"
            - name: SERVERPORT
              value: "51820"
            - name: PEERS
              value: "phone,laptop"
            - name: PEERDNS
              value: "192.168.1.201"
            - name: INTERNAL_SUBNET
              value: "10.13.13.0"
            - name: POSTUP
              value: >-
                iptables -A FORWARD -i wg0 -j ACCEPT;
                iptables -A FORWARD -o wg0 -j ACCEPT;
                iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
            - name: POSTDOWN
              value: >-
                iptables -D FORWARD -i wg0 -j ACCEPT;
                iptables -D FORWARD -o wg0 -j ACCEPT;
                iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
          volumeMounts:
            - name: wireguard-config
              mountPath: /config
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
        # Sidecar: exports WireGuard peer stats (handshake times, bytes transferred) to Prometheus
        - name: wireguard-exporter
          image: mindflavor/prometheus-wireguard-exporter:3.6.6
          ports:
            - containerPort: 9586
              name: metrics
          securityContext:
            capabilities:
              add:
                - NET_ADMIN   # needed to run `wg show`
      volumes:
        - name: wireguard-config
          persistentVolumeClaim:
            claimName: wireguard-config
        - name: lib-modules
          hostPath:
            path: /lib/modules
