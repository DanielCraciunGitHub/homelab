# ClusterIP Service exposing the wireguard-exporter sidecar metrics port
apiVersion: v1
kind: Service
metadata:
  name: wireguard-metrics
  namespace: wireguard-system
  labels:
    app: wireguard-metrics
spec:
  selector:
    app: wireguard
  ports:
    - name: metrics
      port: 9586
      targetPort: 9586
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: wireguard-metrics
  namespace: wireguard-system
  labels:
    release: monitoring
spec:
  endpoints:
    - port: metrics
      interval: 30s
  namespaceSelector:
    matchNames:
      - wireguard-system
  selector:
    matchLabels:
      app: wireguard-metrics
