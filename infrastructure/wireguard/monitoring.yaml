apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: wireguard-metrics
  namespace: wireguard-system
  labels:
    release: monitoring
spec:
  endpoints:
    - port: metrics
      interval: 30s
  namespaceSelector:
    matchNames:
      - wireguard-system
  selector:
    matchLabels:
      app: wireguard-metrics
