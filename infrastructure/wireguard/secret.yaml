apiVersion: v1
kind: Secret
metadata:
  name: wireguard-secret
  namespace: wireguard-system
type: Opaque
stringData:
  # Base64-encoded WireGuard private key for the server.
  # Generate with: wg genkey | base64
  WIREGUARD_PRIVATE_KEY: ""
  # Pre-shared key (optional, for extra security per-peer).
  # Generate with: wg genpsk | base64
  WIREGUARD_PRESHARED_KEY: ""
