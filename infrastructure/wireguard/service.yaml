apiVersion: v1
kind: Service
metadata:
  name: wireguard
  namespace: wireguard-system
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.203
  externalTrafficPolicy: Local
  selector:
    app: wireguard
  ports:
    - port: 51820
      targetPort: 51820
      protocol: UDP
      name: wireguard-udp
